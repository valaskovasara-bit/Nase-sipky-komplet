function setSetting(k,v){if(!state.game)return;commit(()=>{state.game.settings[k]=v;if(k==='xstart')state.game.scores=state.players.map(()=>0)})}
function settingsMarkup(g){let t=g.type,s=g.settings;const sel=(k,values)=>`<select onchange="setSetting('${k}',this.value)">${values.map(([v,l])=>`<option value="${v}" ${String(s[k])===String(v)?'selected':''}>${l}</option>`).join('')}</select>`;let html='';if(t==='high')html=`Kol: ${sel('rounds',[[5,5],[10,10],[15,15],[20,20]])}`;if(t==='fives')html=`Cíl: ${sel('target',[[25,25],[51,51],[75,75],[100,100]])}`;if(t==='x01')html=`Start: ${sel('xstart',[[301,301],[501,501],[701,701],[901,901]])} Vstup: ${sel('in',[['single','Single'],['double','Double'],['master','Master']])} Výstup: ${sel('out',[['single','Single'],['double','Double'],['master','Master']])}`;if(['cricket','scram'].includes(t))html=`Pořadí: ${sel('order',[['fixed','Pevné'],['reverse','Obrácené'],['free','Libovolné']])}${t==='cricket'?` Body: ${sel('cricket',[['marks','Bez bodů'],['points','Standard'],['cut','Cut-Throat']])}`:''}`;if(t==='golf')html=`Jamek: ${sel('holes',[[9,9],[18,18]])}`;return html?`<div class="row tiny" style="margin-top:6px">${html}</div>`:''}
function polar(r,a){let q=(a-90)*Math.PI/180;return [250+r*Math.cos(q),250+r*Math.sin(q)]}
function sector(r1,r2,a1,a2){let p1=polar(r2,a1),p2=polar(r2,a2),p3=polar(r1,a2),p4=polar(r1,a1);return `M${p1} A${r2} ${r2} 0 0 1 ${p2} L${p3} A${r1} ${r1} 0 0 0 ${p4} Z`}
function boardMarkup(){let g=state.game,t=g.type,out='<svg viewBox="0 0 500 500" role="img" aria-label="Interaktivní terč">';for(let i=0;i<20;i++){for(let k=0;k<3;k++){let r2=238-k*57,r1=r2-57,fill=(i%2===0?['#293b50','#395269','#23374c']:['#405269','#273d51','#3b5067'])[k];out+=`<path d="${sector(r1,r2,i*18-9,i*18+9)}" fill="${fill}" stroke="#8193a6" stroke-width="1" onclick="hit(${ORDER[i]},${k+1})"><title>${['Single','Double','Triple'][k]} ${ORDER[i]}</title></path>`}let p=polar(241,i*18);out+=`<text x="${p[0]}" y="${p[1]}" text-anchor="middle" dominant-baseline="central" fill="white" font-size="17" font-weight="800" pointer-events="none">${ORDER[i]}</text>`}out+=`<circle cx="250" cy="250" r="63" fill="#225b52" stroke="#8ee1ca" stroke-width="2" onclick="hit(25,1)"/><circle cx="250" cy="250" r="31" fill="#a84348" stroke="#ffb7b7" stroke-width="2" onclick="hit(50,1)"/><text x="250" y="223" fill="white" font-size="14" text-anchor="middle" pointer-events="none">25</text><text x="250" y="256" fill="white" font-size="15" text-anchor="middle" pointer-events="none">50</text>`;
if(['vyrazko','clobrdo','eliminace'].includes(t)){let occupied={};state.players.forEach((p,pi)=>{for(let k=0;k<3;k++){if(t==='vyrazko'&&k!==g.homes[pi]||t==='clobrdo'&&!g.deployed[pi][k]||g.positions[pi][k]<=0||g.positions[pi][k]>20)continue;let pos=g.positions[pi][k];(occupied[pos]??=[]).push({p,pi,k})}});Object.entries(occupied).forEach(([pos,arr])=>{let i=Number(pos)-1;arr.forEach((x,j)=>{let pt=polar(142,i*18+(j-(arr.length-1)/2)*5);out+=`<circle cx="${pt[0]}" cy="${pt[1]}" r="15" fill="${x.p.color}" stroke="white" stroke-width="2" pointer-events="none"/><text x="${pt[0]}" y="${pt[1]+5}" text-anchor="middle" fill="white" font-size="14" font-weight="900" pointer-events="none">${x.k+1}</text>`})})}return out+'</svg>'}
function targets(g){let t=g.type;if(t==='around')return [g.positions[g.turn][0]+1===21?25:g.positions[g.turn][0]+1];if(t==='obstacles'||t==='vyrazko'){let k=t==='vyrazko'?g.homes[g.turn]:0;return [g.positions[g.turn][k]>=20?25:ORDER[g.positions[g.turn][k]]]};if(t==='shanghai')return [g.round>20?25:g.round];if(t==='golf')return [((g.hole-1)%20)+1];if(['cricket','scram'].includes(t)){let nums=g.settings.order==='reverse'?[25,20,19,18,17,16,15]:[20,19,18,17,16,15,25];if(g.settings.order==='free')return [20,19,18,17,16,15,25];let pi=g.turn;let current=nums.find(n=>(g.marks[pi][n]||0)<3);return current?[current]:nums}return null}
function hit(n,m){let g=state.game;if(!g||g.winner!==null||g.darts>=3)return;let t=g.type,pi=g.turn,v=n===50?50:n===25?25:n*m;commit(()=>{g.darts++;g.shotTotal[pi]++;g.throws.push(n===0?'MIMO':n===25?'25':n===50?'50':`${['','S','D','T'][m]}${n}`);if(t==='high'){g.scores[pi]+=v}
else if(t==='x01'){let before=g.settings.xstart-g.scores[pi];let qualifies=g.settings.in==='single'||(g.settings.in==='double'&&(m===2||n===50))||(g.settings.in==='master'&&(m>=2||n===50));if(!g.started[pi]&&!qualifies)return;g.started[pi]=true;let left=before-v,goodout=g.settings.out==='single'||(g.settings.out==='double'&&(m===2||n===50))||(g.settings.out==='master'&&(m>=2||n===50));if(left<0||left===1&&g.settings.out==='double'||left===0&&!goodout){g.scores[pi]=g.turnStartScore??g.scores[pi];g.darts=3;g.throws.push('BUST')}else{g.scores[pi]+=v;if(left===0)g.winner=pi}}
else if(t==='around'){let needed=g.positions[pi][0]+1;if(n===needed||needed===21&&(n===25||n===50)){g.positions[pi][0]++;if(g.positions[pi][0]>=21)g.winner=pi}}
else if(t==='obstacles'||t==='vyrazko'){let k=t==='vyrazko'?g.homes[pi]:0;if(k>=3)return;let pos=g.positions[pi][k],req=pos>=20?25:ORDER[pos],valid=(req===25?(n===25||n===50):n===req&&(t==='vyrazko'||!g.settings.obstacles.includes(n)||m===3));if(valid){if(req===25){if(t==='vyrazko'){g.homes[pi]++;if(g.homes[pi]===3)g.winner=pi}else g.winner=pi}else{g.positions[pi][k]++;if(t==='vyrazko'&&g.positions[pi][k]>=11)g.checkpoint[pi][k]=true;if(t==='vyrazko')state.players.forEach((p,j)=>{if(j===pi||g.homes[j]>=3)return;let a=g.homes[j];if(g.positions[j][a]===g.positions[pi][k])g.positions[j][a]=g.checkpoint[j][a]?10:0})}}}
else if(t==='fives'){g.stageScores[pi]+=v}
else if(t==='cricket'||t==='scram'){let target=n===50?25:n;if(![15,16,17,18,19,20,25].includes(target))return;let marks=n===50?2:m;if(t==='scram'&&g.phase===0){let defender=g.role;if(pi!==defender)return;g.marks[pi][target]=Math.min(3,(g.marks[pi][target]||0)+marks)}else{let old=g.marks[pi][target]||0,extra=Math.max(0,old+marks-3);g.marks[pi][target]=Math.min(3,old+marks);if(t==='cricket'&&g.settings.cricket!=='marks'&&extra){let score=extra*(target===25?25:target);if(g.settings.cricket==='points')g.scores[pi]+=score;else state.players.forEach((p,j)=>{if(j!==pi&&(g.marks[j][target]||0)<3)g.scores[j]+=score})}if(t==='scram'&&g.phase===1&&pi!==g.role){let closed=(g.marks[g.role][target]||0)>=3;if(closed)g.scores[pi]+=marks*(target===25?25:target)}}}
else if(t==='shanghai'){let need=g.round===21?25:g.round;if(n===need||need===25&&(n===25||n===50)){g.scores[pi]+=v;g.moves.push(m);if(need!==25&&[1,2,3].every(z=>g.moves.includes(z)))g.winner=pi}}
else if(t==='golf'){let need=((g.hole-1)%20)+1;if(n===need){g.shots[pi]+=m;if(g.shots[pi]>=3)g.closed[pi]=true}g.golfScore[pi]++}
else if(t==='clobrdo'){let dice=g.dice[0];if(dice==null)return;let k=g.selected??g.deployed[pi].findIndex((x,i)=>x&&g.positions[pi][i]<25);if(k<0)return;let target=g.positions[pi][k]+dice;if(target<=25){g.stageScores[pi]+=v;if((target===25&&(n===25||n===50))||(target!==25&&g.stageScores[pi]===target)){g.positions[pi][k]=target;g.dice.shift();g.stageScores[pi]=0;if(target===25){g.homes[pi]++;if(g.homes[pi]===3)g.winner=pi}else state.players.forEach((p,j)=>{if(j===pi)return;g.positions[j].forEach((pos,h)=>{if(pos===target&&g.deployed[j][h]){g.deployed[j][h]=false;g.positions[j][h]=0}})});if(g.dice.length)g.darts=0}else if(g.stageScores[pi]>target){g.darts=3;g.stageScores[pi]=0}}}
else if(t==='eliminace'){g.scores[pi]+=v;state.players.forEach((p,j)=>{if(j!==pi&&g.scores[j]===g.scores[pi])g.scores[j]=0})}
})}
function chooseFig(k){commit(()=>state.game.selected=k)}
function addDie(n){let g=state.game;if(!g||g.type!=='clobrdo')return;commit(()=>{let pi=g.turn;if(n===6&&g.deployed[pi].some(x=>!x)){let k=g.deployed[pi].findIndex(x=>!x);if(!g.deployed[pi].some((x,i)=>x&&g.positions[pi][i]===0)){g.deployed[pi][k]=true;g.positions[pi][k]=0;g.selected=k}else g.dice.push(n)}else g.dice.push(n)})}
function finishTurn(){let g=state.game;if(!g||g.winner!==null)return;commit(()=>{let pi=g.turn,t=g.type;g.turns[pi]++;if(t==='fives'){if(g.stageScores[pi]%5===0)g.scores[pi]+=g.stageScores[pi]/5;g.stageScores[pi]=0}
if(t==='high'&&g.round>=Number(g.settings.rounds)&&g.turns.every(x=>x>=Number(g.settings.rounds)))return decideMax(g);

if(t==='x01'&&g.winner===null)g.turnStartScore=undefined;
if(t==='cricket'&&state.players.every((p,j)=>[15,16,17,18,19,20,25].every(n=>(g.marks[j][n]||0)>=3)))return decideMax(g);

if(t==='scram'&&g.phase===0&&[15,16,17,18,19,20,25].every(n=>(g.marks[g.role][n]||0)>=3)){g.phase=1;g.marks=g.marks.map(()=>({}));g.turn=g.role===0?1:0;g.darts=0;g.throws=[];return}
if(t==='eliminace'&&g.round>=10&&g.turns.every(x=>x>=10))return decideMax(g);
if(t==='shanghai'&&g.round>=21&&g.turns.every(x=>x>=21))return decideMax(g);
if(t==='golf'){g.closed[pi]=true;if(g.closed.every(Boolean)){g.hole++;g.closed=g.closed.map(()=>false);g.shots=g.shots.map(()=>0);if(g.hole>Number(g.settings.holes))return decideMin(g)}}
let next=(pi+1)%state.players.length;g.turn=next;if(next===g.starter)g.round++;g.darts=0;g.throws=[];g.moves=[];g.stageScores[pi]=0;g.dice=[];g.selected=undefined;if(t==='x01')g.turnStartScore=g.scores[next]})}
function decideMax(g){let top=Math.max(...g.scores),w=g.scores.map((s,i)=>s===top?i:-1).filter(x=>x>=0);if(w.length===1)g.winner=w[0];else{g.settings.rounds=Number(g.settings.rounds)+1;g.settings.target=top+1;g.turns=g.turns.map(x=>x);g.extraTarget++}}
function decideMin(g){let min=Math.min(...g.golfScore),w=g.golfScore.map((s,i)=>s===min?i:-1).filter(x=>x>=0);if(w.length===1)g.winner=w[0];else g.settings.holes=Number(g.settings.holes)+1}
function award(){let g=state.game;if(g.winner===null)return;commit(()=>{let w=g.winner;if(state.mode==='tournament'){state.players[w].points+=games.find(x=>x[0]===g.type)[2];state.played.push(g.type);state.nextStarter=(state.nextStarter+1)%state.players.length;if(state.players[w].points>=10){state.champion=w;state.screen='champion'}else state.screen='choose'}else state.screen='choose';state.game=null})}
function pickWinner(i){if(!confirm('Potvrdit vítěze '+state.players[i].name+'?'))return;commit(()=>state.game.winner=i)}
function gameScreen(){let g=state.game,t=g.type,pi=g.turn,p=state.players[pi],name=games.find(x=>x[0]===t)[1],isBoard=!(['cricket','scram'].includes(t)&&g.settings.order!=='free');let targ=targets(g),restricted=['around','obstacles','vyrazko','shanghai','golf','cricket','scram'].includes(t),targetButtons=targ&&restricted?`<div class="grid g3 numbers">${targ.map(n=>n===25?btn('BULL 25','hit(25,1)')+btn('BULL 50','hit(50,1)'):btn('S'+n,`hit(${n},1)`)+btn('D'+n,`hit(${n},2)`)+btn('T'+n,`hit(${n},3)`)).join('')}</div>`:'';
let lines=state.players.map((x,i)=>{let detail=['vyrazko','clobrdo'].includes(t)?` · doma ${g.homes[i]}/3 <div class="tiny">${g.positions[i].map((pos,k)=>`<span style="white-space:nowrap">${k+1}: ${pos>=21?'🏠':t==='clobrdo'&&!g.deployed[i][k]?'čeká':pos===0?'START':ORDER[pos-1]||pos}${g.checkpoint[i][k]?' 🛡️':''}</span>`).join(' · ')}</div>`:t==='around'||t==='obstacles'?` · ${g.positions[i][0]}/21`:t==='x01'?` · zbývá ${g.settings.xstart-g.scores[i]}`:t==='golf'?` · ${g.golfScore[i]} ran`: ` · ${g.scores[i]} b.`;return `<div class="playerline" style="border-left:5px solid ${x.color};${i===pi?'outline:1px solid #b4f7de':''}"><b>${esc(x.name)}</b>${detail}</div>`}).join('');
let extra=t==='clobrdo'?`<div class="chip">🎲 Kostky: ${g.dice.join(', ')||'—'} · Součet šipek: ${g.stageScores[pi]}</div><div class="grid g3">${[1,2,3,4,5,6].map(n=>btn('🎲 '+n,`addDie(${n})`)).join('')}</div><div class="row">${[0,1,2].map(k=>btn('Figurka '+(k+1),`chooseFig(${k})`,g.selected===k?'selected':'' )).join('')}</div>`:'';
let hint=t==='vyrazko'?`Další číslo: ${g.homes[pi]>=3?'HOTOVO':g.positions[pi][g.homes[pi]]>=20?'BULL':ORDER[g.positions[pi][g.homes[pi]]]}`:t==='golf'?`Jamka ${g.hole} · potřebuješ ${Math.max(0,3-g.shots[pi])} značky`:t==='shanghai'?`Kolo ${g.round} · cíl ${g.round===21?'BULL':g.round}`:t==='fives'?`Součet kola ${g.stageScores[pi]} · body při dělení 5`:t==='clobrdo'?'Zadej kostku, vyber figurku a tref přesný cíl':t==='x01'?`Zbývá ${g.settings.xstart-g.scores[pi]}`:t==='around'?`Další ${g.positions[pi][0]>=20?'BULL':g.positions[pi][0]+1}`:t==='obstacles'?`Další ${g.positions[pi][0]>=20?'BULL':ORDER[g.positions[pi][0]]}`:'Zadávej zásahy';
let entry=isBoard?`<div class="boardwrap">${boardMarkup()}</div>`: `<div>${targetButtons}</div>`;
let fallback=isBoard?`<details><summary class="tiny">Zadat tlačítky místo terče</summary><div class="grid g5 numbers">${Array.from({length:20},(_,i)=>btn(i+1,`hit(${i+1},1)`)).join('')}</div><div class="row">${btn('D',"setMult(2)",g.mult===2?'selected':'')}${btn('T',"setMult(3)",g.mult===3?'selected':'')}</div></details>`:'';
el.innerHTML=`<div class="panel"><div class="row between"><div><b>${name}</b><div class="tiny muted">Kolo ${g.round} · šipka ${Math.min(3,g.darts+1)}/3</div></div><div class="turn" style="color:${p.color}">${esc(p.name)} 🎯</div></div>${settingsMarkup(g)}</div><div class="panel"><div class="gamearea">${entry}<div class="side"><div>${lines}</div><div class="chip">${hint}</div>${extra}<div class="tiny muted">Zadáno: ${g.throws.join(' · ')||'—'}</div><div class="actionbar">${btn('↶ ZPĚT','undo()','',!history.length)}${btn('MIMO (0)','hit(0,1)','',g.darts>=3||g.winner!==null)}</div><div class="actionbar">${btn('Další tah →','finishTurn()','primary',g.winner!==null)}</div>${fallback}</div></div></div>${g.winner!==null?`<div class="panel"><h2>🏆 Vyhrává ${esc(state.players[g.winner].name)}!</h2>${btn('Potvrdit výsledek a pokračovat','award()','primary')} ${btn('↶ ZPĚT','undo()')}</div>`:''}<div class="panel foot"><b>Další možnosti</b><p class="tiny muted">Všechny zásahy i ukončení tahu lze vrátit. Změny se ukládají automaticky.</p><div class="row">${btn('↶ Vrátit krok','undo()','',!history.length)}${btn('Ukončit disciplínu','abandon()','warn')}</div><details style="margin-top:12px"><summary>Pokročilé možnosti a oprava výsledku</summary><p class="tiny muted">Nouzové určení vítěze při neúplném pravidle či výjimečné situaci.</p><div class="grid g2">${state.players.map((x,i)=>btn('🏆 '+esc(x.name),`pickWinner(${i})`)).join('')}</div></details></div>`}
function setMult(m){commit(()=>state.game.mult=m)}
function abandon(){if(confirm('Opravdu opustit rozehranou disciplínu?'))commit(()=>{state.game=null;state.screen='choose'})}
function resetAll(){if(confirm('Smazat celý turnaj a uložený postup?')&&confirm('Opravdu vše smazat?'))commit(()=>{state=initial()})}
function render(){document.getElementById('topscore').innerHTML=state.mode==='tournament'?`🏆 ${state.players.map(p=>`<span style="color:${p.color}"><b>${esc(p.name)} ${p.points}/10</b></span>`).join('')}`:'🎯 NAŠE ŠIPKY';if(state.screen==='home')home();else if(state.screen==='choose')choose();else if(state.screen==='game'&&state.game)gameScreen();else if(state.screen==='champion')el.innerHTML=`<div class="panel" style="text-align:center"><h1>🏆 VÍTĚZ TURNAJE!</h1><h2>${esc(state.players[state.champion].name)}</h2><p>${state.players[state.champion].points} bodů</p>${btn('Nový turnaj',"newMode('tournament')",'primary')}</div>`;else home();if(state.screen==='home')el.insertAdjacentHTML('beforeend',`<div class="panel foot">${btn('⚠️ Smazat uložený postup','resetAll()','warn')}</div>`)}render();
</script></body></html>
